name: osc-mouse-v1-model

channels:
  - conda-forge
  - bioconda
  - kaeldai
  - nodefaults

dependencies:
  # Basics
  # 3.12 is not compatible with allensdk (as of 7/1/2024)
  - python=3.11
  - pip

  # Nest (PointNet backend); the paper simulations were run with NEST 3.8
  - nest-simulator=3.8  # >=3.6 needed for glif_psc_double_alpha

  # Convenience
  - black
  - iminuit=2.28
  - snakemake=9.13.5  # Snakefile uses Snakemake 9 syntax
  - jupyter
  - nbconvert
  - ipympl
  - pandarallel=1.6.5
  - polars=1.5

  # bmtk
  - pytest
  - mpi4py
  - openmpi  # conda-forge nest-simulator 3.8 (py311) is built against openmpi
  - bmtk=1.1.3
  - numba=0.60
  - h5py=3.11

  # modeling
  - openpyxl

  # analysis and figures
  - matplotlib=3.9.1
  - seaborn=0.13.2
  - statsmodels=0.14.2
  - scikit-learn

  # allensdk (based on AllenSDK/requirements.txt to avoid pip package override)
  - scipy=1.10.1
  - numpy=1.23.5
  - pandas=1.5.3
  - xarray<2023.2.0
  - future
  - jinja2
  - nest-asyncio
  - psycopg2-binary
  - pynrrd
  - python-dateutil
  - pytables
  - requests
  - scikit-build
  - scikit-image=0.24.0
  - semver
  - simpleitk
  - simplejson
  - six
  - sqlalchemy
  - tqdm

  # PIP dependencies
  - pip:
    # for modeling
    - allensdk==2.16.2
    - pylightxl
    - sonata
    # for analysis and figures
    - emd==0.8.1  # empirical mode decomposition (emd_analysis_comprehensive.py)
    - statannot==0.2.3
